services:
  sharkai:
    build: .
    container_name: sharkai
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?Falta DISCORD_TOKEN en .env}
      - GROQ_API_KEY=${GROQ_API_KEY:?Falta GROQ_API_KEY en .env}
      - GIT_REPO=${GIT_REPO:-https://github.com/sshsrv/sharkai.git}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - POLL_SECONDS=${POLL_SECONDS:-60}
      - DATA_DIR=/app/data
    volumes:
      - sharkai-code:/app
      - sharkai-data:/app/data

volumes:
  sharkai-code:
  sharkai-data:
bot:
 default_model: openai/gpt-oss-120b
 default_lang: en
 cooldown_seconds: 3
 shared_daily_limit: 1000
 history_limit: 6
 data_dir: ./data
 accent_color: 0xff5faf
 accent_color_enabled: true

ai:
 default_prompt_en: "You are SharkAI, an intelligence assistant. Answer concisely, precisely and helpfully. No filler, no apologies."
 default_prompt_es: "Eres SharkAI, un asistente de inteligencia. Responde de forma concisa, precisa y útil. Sin relleno ni disculpas."
 temperature: 0.7
 max_tokens: 4096

providers:
  groq:
    label: Groq
    endpoint: https://api.groq.com/openai/v1/chat/completions
    api_key_env: GROQ_API_KEY
  google:
    label: Google
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GOOGLE_API_KEY
  openrouter:
    label: OpenRouter
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
  mistral:
    label: Mistral
    endpoint: https://api.mistral.ai/v1/chat/completions
    api_key_env: MISTRAL_API_KEY


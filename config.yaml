bot:
 default_model: openai/gpt-oss-120b
 default_lang: en
 cooldown_seconds: 3
 shared_daily_limit: 1000
 history_limit: 6
 data_dir: ./data

ai:
 default_prompt_en: "You are SharkAI, an intelligence assistant. Answer concisely, precisely and helpfully. No filler, no apologies."
 default_prompt_es: "Eres SharkAI, un asistente de inteligencia. Responde de forma concisa, precisa y útil. Sin relleno ni disculpas."
 temperature: 0.7
 max_tokens: 4096

providers:
  groq:
    label: Groq
    endpoint: https://api.groq.com/openai/v1/chat/completions
    api_key_env: GROQ_API_KEY
  google:
    label: Google
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GOOGLE_API_KEY

models:
  openai/gpt-oss-120b:
    name: GPT-OSS 120B
    provider: groq
    description: "OpenAI open-source model (120B). General purpose, high performance."
    tpm: 8000
    rpm: 1000
    rpd: 1000
    context: 131072
    multimodal: false
  openai/gpt-oss-20b:
    name: GPT-OSS 20B
    provider: groq
    description: "GPT-OSS 20B. Faster and lighter than the 120B."
    tpm: 8000
    rpm: 1000
    rpd: 1000
    context: 131072
    multimodal: false
  openai/gpt-oss-safeguard-20b:

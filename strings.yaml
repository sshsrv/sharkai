    error: 'Error: {{0}}'
    factCheckPrompt: "Eres un experto en verificación de hechos. Analiza el siguiente mensaje y produce una verificación estructurada.\n\nTu respuesta DEBE usar exactamente estas 3 secciones como encabezados de markdown, en este orden:\n\n## Veredicto\nEmpieza con un emoji de círculo de color y su etiqueta (🟢 Verdadero, 🟡 Engañoso, 🟠 A medias, 🔴 Falso, ⚪ Incierto),\ny después el resumen conciso de una línea como una única viñeta en la línea siguiente, que empieza con \"- \".\n\n## Análisis\nRazonamiento detallado, evidencia y contexto. Sé conciso pero exhaustivo.\n\n## Fuentes\nLista las fuentes como viñetas. TODAS las fuentes DEBEN incluir un enlace URL. Si no hay fuente específica, indica la base de tu razonamiento.\n\nNO añadas texto fuera de estas 3 secciones.\nSepara las tres secciones con un único salto de línea — sin líneas vacías entre secciones, y sin línea vacía justo después de un encabezado.\nNO incluyas 'Claim:' ni ningún prefijo antes del mensaje del usuario — el mensaje del usuario se mostrará separado arriba de tu respuesta.\n\nMensaje a verificar:\n> {{0}}"
    replyPrompt: 'Eres un asistente útil. Responde al siguiente mensaje de forma directa y concisa. No empieces con preámbulos tipo IA. No hagas preguntas de clarificación — simplemente da la mejor respuesta que puedas.\n\nMensaje al que responder:\n> {{0}}'

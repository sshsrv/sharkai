commands:
  sh:
    name: "sh"
    description: "SharkAI: all-in-one AI assistant"
    integration_types:
      - 0
      - 1
    contexts:
      - 0
      - 1
      - 2
    subcommands:
      ask:
        description: "Ask something using your default model"
        options:
          message:
            description: "What you want to ask"
            type: 3
            required: true
          model:
            description: "One-time model override for this question"
            type: 3
            required: false
            choices:
          visible:
            description: "True = visible for everyone (default). False = only you (ephemeral)"
            type: 5
            required: false
      model:
        description: "View or change your default model"
        options:
          model:
            description: "Model (omitting shows the current one)"
            type: 3
            required: false
            choices:
          info:
            description: "Show model limits (default: true)"
            type: 5
            required: false
      prompt:
        description: "View or change your custom system prompt"
        options:
          text:
            description: "New custom prompt (used instead of the default)"
            type: 3
            required: false
          clear:
            description: "Go back to the default prompt"
            type: 5
            required: false
      language:
        description: "Language of bot UI and AI answers"
        options:
          language:
            description: "Language"
            type: 3
            required: false
            choices:
              en: English
              es: Español
      usage:
        description: "Show your shared usage and live limits"
        options: {}
      new:
        description: "Start a new conversation (clears context)"
        options: {}
      status:
        description: "Show your current configuration"
        options: {}
      reset:
        description: "Reset all your settings to defaults"
        options: {}

responses:
  en:
    answerTruncated: '…'
    thinkingText: '{{0}} is thinking…'
    cooldown: 'Wait {{0}}s between questions.'
    error: 'Error: {{0}}'
    factCheckPrompt: "You are an expert fact-checker. Analyze the following message and produce a structured fact-check.\n\nYou MUST respond using exactly these 4 sections in this order, using list format:\n\n- **Claim:** Quote or paraphrase the key claim from the message. Include the original message link at the end: [Original message]({{1}})\n- **Verdict:** State your verdict using one of these colored circle emojis: 🟢 True, 🟡 Misleading, 🟠 Half-true, 🔴 False, ⚪ Uncertain. Then a short one-line summary.\n- **Analysis:** Detailed reasoning, evidence, and context. Be concise but thorough.\n- **Sources:** List sources as bullet points with links. If no specific source, state your reasoning basis.\n\nDo NOT add any text outside these 4 sections. Do NOT use headers (#), use list format (- **Section:**).\n\nMessage to fact-check:\n> {{0}}"
    replyPrompt: 'You are a helpful assistant. Reply to the following message directly and concisely. Don''t start with AI-like preambles. Don''t ask clarifying questions — just give the best answer you can.\n\nMessage to reply to:\n> {{0}}'
    langRule: 'You MUST respond in English, no matter what language the user writes in. Never follow the language of the question.'
    makeVisible: '👁 Make Visible'
    contextThinking: '{{0}} is thinking…'

commands:
  sh:
    name: "sh"
    description: "SharkAI: all-in-one AI assistant"
    integration_types:
      - 0
      - 1
    contexts:
      - 0
      - 1
      - 2
    subcommands:
      ask:
        description: "Ask something using your default model"
        options:
          message:
            description: "What you want to ask"
            type: 3
            required: true
          model:
            description: "One-time model override for this question"
            type: 3
            required: false
            choices:
          visible:
            description: "True = visible for everyone (default). False = only you (ephemeral)"
            type: 5
            required: false
      set:
        description: "Set your model, prompt, or both"
        options:
          model:
            description: "Default model (autocomplete)"
            type: 3
            required: false
          prompt:
            description: "Custom system prompt (empty string to reset)"
            type: 3
            required: false
      language:
        description: "UI language (AI always answers in your language)"
        options:
          language:
            description: "Language"
            type: 3
            required: true
            choices:
              en: English
              es: Español
      models:
        description: "List all models with usage and privacy info"
        options: {}
      usage:
        description: "Show detailed usage of your current model"
        options: {}
      clear:
        description: "Clear your conversation history (start fresh context)"
        options: {}
      reset:
        description: "Reset all your settings to defaults"
        options: {}

responses:
  en:
    answerTruncated: '…'
    thinkingText: '{{0}} is thinking…'
    cooldown: 'Wait {{0}}s between questions.'
    error: 'Error: {{0}}'
    factCheckPrompt: "You are an expert fact-checker. Analyze the following message and produce a structured fact-check.\n\nYour response MUST use exactly these 3 sections as markdown headings, in this order:\n\n## Verdict\nStart with one colored circle emoji and its label (🟢 True, 🟡 Misleading, 🟠 Half-true, 🔴 False, ⚪ Uncertain),\nthen the concise one-line summary as a single bullet point on the next line, starting with \"- \".\n\n## Analysis\nDetailed reasoning, evidence, and context. Be concise but thorough.\n\n## Sources\nList sources as bullet points. Every source MUST include a URL link. If no specific source, state your reasoning basis.\n\nDo NOT add any text outside these 3 sections.\nSeparate the three sections with a single line break — no empty lines between sections, and no empty line directly after a heading.\nDo NOT include 'Claim:' or any prefix before the user message — the user message will be displayed separately above your response.\n\nMessage to fact-check:\n> {{0}}"
    replyPrompt: 'You are a helpful assistant. Reply to the following message directly and concisely. Don''t start with AI-like preambles. Don''t ask clarifying questions — just give the best answer you can.\n\nMessage to reply to:\n> {{0}}'
    summarizePrompt: 'Summarize the following message in a concise, clear way. Keep the key points, strip the noise. No preamble, no filler.\n\nMessage to summarize:\n> {{0}}'
    explainPrompt: 'Explain the following message in detail. Break down key concepts, provide context, and clarify anything that might be confusing. Be thorough but clear.\n\nMessage to explain:\n> {{0}}'
